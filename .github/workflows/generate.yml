name: Generate zapret2 lists

on:
  workflow_dispatch:
  schedule:
    - cron: '23 1 * * *'
  push:
    paths:
      - '.github/workflows/generate.yml'
      - 'scripts/generate.mjs'

permissions:
  contents: write

concurrency:
  group: zapret2-geolists-${{ github.ref }}

jobs:
  generate:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download sources
        run: |
          curl --fail --silent --show-error --location --retry 3 --max-time 180 \
            https://raw.githubusercontent.com/runetfreedom/russia-v2ray-rules-dat/release/geosite.dat \
            --output "$RUNNER_TEMP/geosite.dat"
          curl --fail --silent --show-error --location --retry 3 --max-time 60 \
            https://raw.githubusercontent.com/runetfreedom/russia-blocked-geoip/release/text/cloudflare.txt \
            --output "$RUNNER_TEMP/cloudflare.txt"
          curl --fail --silent --show-error --location --retry 3 --max-time 60 \
            https://raw.githubusercontent.com/runetfreedom/russia-blocked-geoip/release/text/ru.txt \
            --output "$RUNNER_TEMP/ru.txt"
      - name: Generate and validate lists
        run: node scripts/generate.mjs "$RUNNER_TEMP/geosite.dat" "$RUNNER_TEMP/cloudflare.txt" lists "$RUNNER_TEMP/ru.txt"
      - name: Publish changes
        run: |
          git add -- lists/
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update zapret2 lists'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
